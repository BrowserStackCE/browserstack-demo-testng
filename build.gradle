task espresso(type: Test) {
    jvmArgs = []
    filter {
        includeTestsMatching 'com.test.app.espresso.EspressoTest'
    }
}

task xcuitest(type: Test) {
    jvmArgs = []
    filter {
        includeTestsMatching 'com.test.app.xcui.XCUITest'
    }
}

task runServer(type: JavaExec) {
    group = 'application'
    description = 'Run the HTTP server'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.local.server.MyHttpServer'
}
